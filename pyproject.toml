[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visqai"
version = "1.0.0"
description = "VisQ.AI: physics-informed viscosity prediction"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Paul MacNichol", email = "paul.macnichol@qatchtech.com" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.8",
    "numpy>=2.0",
    "pandas>=2.3",
    "scikit-learn>=1.7",
    "scipy>=1.16",
    "joblib>=1.5",
    "matplotlib>=3.10",
    "optuna>=4.9",
    "cryptography>=46",
    "loguru>=0.7",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "pytest-cov>=7.1", "flake8"]

[tool.setuptools.packages.find]
where = ["src"]
